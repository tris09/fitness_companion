name: fitness_companion
description: "A fitness app with a AI-Assisted coach."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  google_fonts: ^9.0.0
  timezone: ^0.10.1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  flutter_local_notifications: 18.0.1
  url_launcher: ^6.3.3
  crypto: ^3.0.8
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App icon: run once with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#C8FA16"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/